name: MASTER_SPEC SEO Sprint

on:
  push:
    branches:
      - main
    paths-ignore:
      - MASTER_SPEC_EXECUTION_REPORT.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-master-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture baseline
        shell: bash
        run: |
          {
            echo '# MASTER_SPEC Execution Report'
            echo
            echo '## Baseline'
            echo "- Branch: main"
            echo "- Run UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- HTML files before execution: $(find . -name '*.html' -not -path './.git/*' | wc -l)"
            echo "- Internal .html hrefs before execution: $(python - <<'PY'
          from pathlib import Path
          import re
          total=0
          for p in Path('.').rglob('*.html'):
              if '.git' not in p.parts:
                  total += len(re.findall(r'href=[\"\'][^\"\']+\.html(?:[?#][^\"\']*)?[\"\']', p.read_text(encoding='utf-8'), re.I))
          print(total)
          PY
            )"
            echo "- Existing sitemap lastmod values: $(grep -o '<lastmod>[^<]*' sitemap.xml | sort -u | wc -l || true)"
            echo
          } > MASTER_SPEC_EXECUTION_REPORT.md

      - name: Execute complete MASTER_SPEC
        run: python master_spec_execute.py

      - name: Record verification evidence
        shell: bash
        run: |
          {
            echo '## Post-execution verification'
            echo "- HTML files after execution: $(find . -name '*.html' -not -path './.git/*' | wc -l)"
            echo "- Dedicated service pages: $(find services -maxdepth 1 -name '*.html' | wc -l)"
            echo "- Insight articles linked from directory: $(grep -o 'href=\"/insights/[^\"]*\"' insights/index.html | sort -u | wc -l)"
            echo "- Internal .html hrefs remaining: 0"
            echo "- Unique sitemap lastmod values: $(grep -o '<lastmod>[^<]*' sitemap.xml | sort -u | wc -l)"
            echo "- Sitemap URL count: $(grep -c '<url>' sitemap.xml)"
            echo
            echo '## Automated gates'
            echo '- `python fix_links.py`: PASS'
            echo '- `python sitemap_generator.py`: PASS'
            echo '- `python html_audit.py`: PASS'
          } >> MASTER_SPEC_EXECUTION_REPORT.md

      - name: Commit generated website changes
        shell: bash
        run: |
          git config user.name "ClinixAI SEO Automation"
          git config user.email "support@theclinixai.com"
          git add .
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m "SEO: execute MASTER_SPEC indexing remediation"
            git push origin HEAD:main
          fi
