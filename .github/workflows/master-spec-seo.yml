name: Sitewide SEO Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate site integrity
        run: python scripts/qa-site.py

      - name: Validate search-engine signals
        run: python scripts/search-engine-audit.py

      - name: Validate advanced on-page SEO
        run: python seo-quality-gate.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-quality-reports
          path: |
            search-engine-readiness-report.json
            seo-quality-report.json
          if-no-files-found: ignore
