<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="resource-hero">
      <div class="shell">
        <p class="eyebrow">Secure discovery channel</p>
        <h1 class="editorial-title">Let’s start with the workflow that needs to change.</h1>
        <p class="lead">Share the operational, scientific or regulatory context. Your enquiry is delivered directly to the TheClinixAI team.</p>
      </div>
    </section>

    <section class="scene">
      <div class="shell form-wrap">
        <form class="form-grid" action="/api/contact" method="post" data-contact-form>
          <div class="contact-honeypot" aria-hidden="true">
            <label for="contact-website">Website</label>
            <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <input name="formStartedAt" type="hidden" value="">

          <div class="field">
            <label for="contact-full-name">Full name *</label>
            <input id="contact-full-name" name="fullName" autocomplete="name" maxlength="120" required>
          </div>
          <div class="field">
            <label for="contact-company">Company name</label>
            <input id="contact-company" name="company" autocomplete="organization" maxlength="160">
          </div>
          <div class="field">
            <label for="contact-designation">Designation</label>
            <input id="contact-designation" name="designation" autocomplete="organization-title" maxlength="120">
          </div>
          <div class="field">
            <label for="contact-email">Business email *</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="field">
            <label for="contact-phone">Contact number *</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required>
          </div>
          <div class="field">
            <label for="contact-country">Country</label>
            <input id="contact-country" name="country" autocomplete="country-name" maxlength="100">
          </div>
          <div class="field">
            <label for="contact-business">Operating business *</label>
            <select id="contact-business" name="business" required>
              <option value="">Select</option>
              <option>Pharmaceutical Manufacturer</option>
              <option>Biotechnology Company</option>
              <option>CRO</option>
              <option>CDMO</option>
              <option>Medical Device Company</option>
              <option>Healthcare Technology</option>
              <option>Hospital / Healthcare Provider</option>
              <option>Academic / Research Institution</option>
              <option>Regulatory Authority</option>
              <option>PV Service Provider</option>
              <option>Consulting Organisation</option>
              <option>Startup</option>
              <option>Student</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="contact-interest">Area of interest *</label>
            <select id="contact-interest" name="interest" required>
              <option value="">Select</option>
              <optgroup label="Nexus Platform">
                <option>Complete Nexus Platform</option>
                <option>Literature Intelligence</option>
                <option>Intake &amp; Triage</option>
                <option>Case Processing</option>
                <option>Medical Review</option>
                <option>Quality Control</option>
                <option>Regulatory Submission</option>
                <option>Aggregate Reporting</option>
                <option>Signal Detection</option>
                <option>AI Nexus</option>
              </optgroup>
              <optgroup label="Services">
                <option>PV Operations</option>
                <option>Quality &amp; Compliance</option>
                <option>Regulatory Documentation</option>
                <option>Safety Systems</option>
                <option>Strategic Consulting</option>
              </optgroup>
              <optgroup label="Academy">
                <option>Individual Program</option>
                <option>Corporate Training</option>
                <option>Internship Program</option>
              </optgroup>
              <optgroup label="Other">
                <option>Research Collaboration</option>
                <option>Partnership</option>
                <option>Careers</option>
                <option>General Enquiry</option>
              </optgroup>
            </select>
          </div>
          <div class="field">
            <label for="contact-team-size">Team size</label>
            <select id="contact-team-size" name="teamSize">
              <option value="">Select</option>
              <option>1–10</option>
              <option>11–50</option>
              <option>51–200</option>
              <option>201–1000</option>
              <option>1000+</option>
            </select>
          </div>
          <div class="field">
            <label for="contact-source">How did you hear about us?</label>
            <select id="contact-source" name="source">
              <option value="">Select</option>
              <option>LinkedIn</option>
              <option>Instagram</option>
              <option>Google Search</option>
              <option>ChatGPT</option>
              <option>Google Gemini</option>
              <option>Referral</option>
              <option>Conference / Event</option>
              <option>Existing Client</option>
              <option>Word of Mouth</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field full">
            <label for="contact-message">Requirement or query *</label>
            <textarea id="contact-message" name="message" data-word-limit maxlength="2500" required placeholder="Briefly describe the workflow, operational challenge, programme or collaboration requirement."></textarea>
            <div class="counter" data-word-count>0 / 300 words</div>
          </div>
          <div class="field full">
            <button class="button button-primary" type="submit">Submit enquiry securely</button>
          </div>
          <div class="field full">
            <p class="contact-status" role="status" aria-live="polite" data-contact-status hidden></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/site.js?v=20260725-sprint1"></script>
  <script src="/contact-form.js?v=20260725-sprint1"></script>

</html>
